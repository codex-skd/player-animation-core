license="${mod_license}"
issueTrackerURL="https://gitlab.com/stalking-dragons/minecraft/player-animation-core"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Stalking Dragons (SKD)"
description='''
A library that allows mods to animate the player without conflicts between mods.
'''
logoFile="icon.png"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[mixins]]
config="player_animation_core.mixins.json"
